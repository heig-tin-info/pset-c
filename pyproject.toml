[project]
name = "pset-c"
version = "0.1.0"
description = "Problem sets for Info1/Info2 C course, built with TeXSmith."
requires-python = ">=3.13"
dependencies = [
    "texsmith[typst]>=0.9.2,<1.0",
    "texsmith-exam>=0.3.2,<1.0",
    "texsmith-fragment-heig-logo>=0.2,<1.0",
]

[project.optional-dependencies]
dev = [
    "PyYAML>=6.0,<7.0",
    "pelican>=4.10,<5.0",
    "markdown>=3.6,<4.0",
]

[tool.uv]
prerelease = "allow"
# pelican pins pygments<2.19.0 but 2.20.0 fixes a ReDoS vulnerability (CVE)
override-dependencies = [
    "pygments>=2.20.0",
]
