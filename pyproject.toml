[project]
name = "exam"
version = "0.1.0"
description = "Exam build using TeXSmith."
requires-python = ">=3.13"
dependencies = [
    "texsmith>=0.2.1,<1.0",
    "texsmith-exam>=0.2.4,<1.0",
]

[project.optional-dependencies]
dev = [
    "PyYAML>=6.0,<7.0",
    "pelican>=4.10,<5.0",
    "markdown>=3.6,<4.0",
]

[tool.uv]
# pelican pins pygments<2.19.0 but 2.20.0 fixes a ReDoS vulnerability (CVE)
override-dependencies = [
    "pygments>=2.20.0",
]
